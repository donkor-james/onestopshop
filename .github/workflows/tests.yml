name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onestopshop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-a-real-secret
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: unused
      RESEND_API_KEY: re_ci_dummy
      PAYSTACK_SECRET_KEY: sk_test_ci_dummy
      PAYSTACK_PUBLIC_KEY: pk_test_ci_dummy
      DB_NAME: onestopshop_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fail if models changed without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (includes real-concurrency tests against PostgreSQL)
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=70
